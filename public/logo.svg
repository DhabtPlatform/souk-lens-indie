<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="t">
  <title id="t">Souk Lens</title>
  <defs>
    <linearGradient id="g" x1="6" y1="4" x2="58" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#8B6CFF"/>
      <stop offset=".52" stop-color="#7C5CFF"/>
      <stop offset="1" stop-color="#00C2A8"/>
    </linearGradient>
    <linearGradient id="s" x1="20" y1="14" x2="44" y2="44" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#E9FFF8"/>
    </linearGradient>
    <radialGradient id="sheen" cx=".28" cy=".12" r=".55" gradientUnits="objectBoundingBox">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity=".22"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="tile"><rect x="3" y="3" width="58" height="58" rx="17"/></clipPath>
  </defs>
  <rect x="3" y="3" width="58" height="58" rx="17" fill="url(#g)"/>
  <g clip-path="url(#tile)">
    <ellipse cx="18" cy="8" rx="30" ry="20" fill="url(#sheen)"/>
  </g>
  <rect x="3.75" y="3.75" width="56.5" height="56.5" rx="16.25" fill="none" stroke="#FFFFFF" stroke-opacity=".24" stroke-width="1.5"/>
  <!-- lens ring -->
  <circle cx="32" cy="29" r="13.5" fill="none" stroke="url(#s)" stroke-width="4.6"/>
  <circle cx="22.6" cy="19.8" r="2.1" fill="#FFFFFF" opacity=".9"/>
  <!-- souk arch inside the lens -->
  <path d="M25.5 36.5v-4.2c0-3.6 2.9-6.5 6.5-6.5s6.5 2.9 6.5 6.5v4.2" fill="none" stroke="#FFFFFF" stroke-width="3.4" stroke-linecap="round"/>
  <!-- stall baseline -->
  <path d="M21 46.5h22" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round"/>
  <path d="M25 42.5h14" stroke="#FFFFFF" stroke-opacity=".72" stroke-width="2.6" stroke-linecap="round"/>
  <!-- discovered gem + sparkle -->
  <circle cx="46.5" cy="15.5" r="4.6" fill="#FFD166" stroke="#0B0B10" stroke-opacity=".12"/>
  <path d="M53.5 5.5l.9 2.1 2.1.9-2.1.9-.9 2.1-.9-2.1-2.1-.9 2.1-.9z" fill="#FFFFFF" opacity=".95"/>
</svg>
